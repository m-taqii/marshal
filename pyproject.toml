[project]
name = "marshal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "m-taqii" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "discord-py>=2.7.1",
    "fastapi[standard]>=0.141.1",
    "openai>=3.8.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "strands-agents>=1.52.0",
    "uvicorn>=0.52.3",
]

[tool.uv]
package = false

[project.scripts]
marshal = "marshal:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
